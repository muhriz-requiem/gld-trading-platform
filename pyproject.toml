[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gld-trading-platform"
version = "0.15.0"
description = "Staged, layer-separated GLD ETF trading system with deterministic stage validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "alpaca-py>=0.43",
    "pandas",
    "numpy",
    "pydantic>=2",
    "python-dotenv",
    "requests",
    "typing-extensions",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
